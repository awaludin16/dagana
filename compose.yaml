# Development-only stack for the Dagana API. Not a production configuration.
name: dagana

services:
    api:
        build:
            context: .
            dockerfile: docker/php/Dockerfile.dev
        environment:
            APP_NAME: Dagana
            APP_ENV: local
            APP_DEBUG: "true"
            APP_KEY: ${APP_KEY:-base64:ZrFI397t4b5Bk32I7fWAF/2gD7iIf1eC+d4d65Wwwp0=}
            APP_URL: ${APP_URL:-http://localhost:8000}
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
            SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,127.0.0.1:5173}
            LOG_CHANNEL: stderr
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: "5432"
            DB_DATABASE: ${POSTGRES_DB:-dagana}
            DB_USERNAME: ${POSTGRES_USER:-dagana}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-dagana_dev}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: "6379"
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
        volumes:
            - ./apps/api:/var/www/api
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-dagana}
            POSTGRES_USER: ${POSTGRES_USER:-dagana}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dagana_dev}
        ports:
            - "54329:5432" #54329 untuk akses luar (DBeaver/Windows), 5432 untuk internal Docker
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-dagana} -d ${POSTGRES_DB:-dagana}",
                ]
            interval: 5s
            timeout: 3s
            retries: 10

    redis:
        image: redis:8-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres_data:
