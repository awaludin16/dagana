# Development-only stack for the Dagana API. Not a production configuration.
name: dagana

services:
    api:
        build:
            context: .
            dockerfile: docker/php/Dockerfile.dev
        environment:
            APP_NAME: Dagana
            APP_ENV: local
            APP_DEBUG: "true"
            APP_KEY: ${APP_KEY:-base64:ZrFI397t4b5Bk32I7fWAF/2gD7iIf1eC+d4d65Wwwp0=}
            APP_URL: ${APP_URL:-http://localhost:8000}
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
            SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,127.0.0.1:5173}
            LOG_CHANNEL: stderr
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: "5432"
            DB_DATABASE: ${POSTGRES_DB:-dagana}
            DB_USERNAME: ${POSTGRES_USER:-dagana}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-dagana_dev}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: "6379"
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: "1025"
            MAIL_USERNAME: null
            MAIL_PASSWORD: null
            MAIL_ENCRYPTION: null
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dagana@example.test}
            MAIL_FROM_NAME: Dagana
            # Gambar katalog: bucket MinIO lokal dengan public read via bucket policy.
            PRODUCT_IMAGES_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dagana}
            PRODUCT_IMAGES_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dagana_dev_secret}
            PRODUCT_IMAGES_BUCKET: dagana-product-images
            PRODUCT_IMAGES_ENDPOINT: http://minio:9000
            PRODUCT_IMAGES_PUBLIC_URL: ${PRODUCT_IMAGES_PUBLIC_URL:-http://localhost:9000/dagana-product-images}
            PRODUCT_IMAGES_REGION: us-east-1
            PRODUCT_IMAGES_USE_PATH_STYLE_ENDPOINT: "true"
        volumes:
            - ./apps/api:/var/www/api
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-dagana}
            POSTGRES_USER: ${POSTGRES_USER:-dagana}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dagana_dev}
        ports:
            - "54329:5432" #54329 untuk akses luar (DBeaver/Windows), 5432 untuk internal Docker
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-dagana} -d ${POSTGRES_DB:-dagana}",
                ]
            interval: 5s
            timeout: 3s
            retries: 10

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025" # UI inbox email dev
            - "1025:1025" # SMTP dev

    redis:
        image: redis:8-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    # S3-compatible storage untuk gambar katalog di development (D-18).
    # Bucket public read diatur lewat bucket policy, bukan object ACL.
    minio:
        # Image resmi MinIO tidak lagi tersedia di Docker Hub/Quay; Chainguard
        # mempublikasikan build upstream MinIO. Digest dipin agar reproducible.
        image: chainguard/minio:latest@sha256:304e0bbeb70a9aa0c40ff26d5a9c0a24296019c6d326ba8b75214fb73441d6e9
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dagana}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dagana_dev_secret}
        ports:
            - "9000:9000" # S3 API
            - "9001:9001" # Console
        volumes:
            - minio_data:/data

    minio-init:
        image: amazon/aws-cli:latest
        depends_on:
            - minio
        environment:
            AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dagana}
            AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dagana_dev_secret}
            AWS_DEFAULT_REGION: us-east-1
            PRODUCT_IMAGES_ENDPOINT: http://minio:9000
        entrypoint: ["/bin/sh", "/init.sh"]
        volumes:
            - ./docker/minio/init.sh:/init.sh:ro

volumes:
    postgres_data:
    minio_data:
