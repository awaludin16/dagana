name: dagana-api

services:
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: dagana-api:dev
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dagana
      DB_USERNAME: dagana
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BROADCAST_CONNECTION: redis
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8081"
    volumes:
      - ../../apps/api:/var/www/html
      - ../docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: dagana-api:dev
    restart: unless-stopped
    command: php artisan horizon
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: dagana
      DB_USERNAME: dagana
      DB_PASSWORD: secret
      REDIS_HOST: redis
    volumes:
      - ../../apps/api:/var/www/html
    depends_on:
      - app

  scheduler:
    image: dagana-api:dev
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: dagana
      DB_USERNAME: dagana
      DB_PASSWORD: secret
      REDIS_HOST: redis
    volumes:
      - ../../apps/api:/var/www/html
    depends_on:
      - app

  reverb:
    image: dagana-api:dev
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: dagana
      DB_USERNAME: dagana
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - ../../apps/api:/var/www/html
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PHP_FPM_HOST=app
    volumes:
      - ../../apps/api:/var/www/html
      - ../docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dagana
      POSTGRES_USER: dagana
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagana -d dagana"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dagana
      MINIO_ROOT_PASSWORD: secret123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: