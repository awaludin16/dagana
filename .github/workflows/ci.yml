# CI minimal Phase 0. Development-grade checks; Flutter belum masuk pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (pint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dagana
          POSTGRES_USER: dagana
          POSTGRES_PASSWORD: dagana_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dagana -d dagana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_KEY: base64:ZrFI397t4b5Bk32I7fWAF/2gD7iIf1eC+d4d65Wwwp0=
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: dagana
      DB_PASSWORD: dagana_dev
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_pgsql, pgsql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Format check (pint)
        run: ./vendor/bin/pint --test
      - name: Create test database
        run: >
          php -r '
          $c = pg_connect("host=127.0.0.1 port=5432 dbname=dagana user=dagana password=dagana_dev");
          pg_query($c, "CREATE DATABASE dagana_test") or print(pg_last_error($c));
          '
      - name: Run tests
        run: php artisan test

  web:
    name: Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-web, customer-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
